[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-former"
version = "1.0.0"
description = "Multi-frequency acoustic beacon discovery, 3D localization, beamforming, and packet decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahdi Tude Ranjbar" }]
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5"]

[project.scripts]
beam-former = "beam_former.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
